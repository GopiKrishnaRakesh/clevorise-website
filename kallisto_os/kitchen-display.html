<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kitchen Display System (KDS) | CLEVORISE OS</title>
  <meta name="description" content="Live kitchen and fulfillment queue with real-time ticket progression, order timing, and autonomous revenue synchronization."/>
  
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  
  <link rel="stylesheet" href="design-system/design-tokens.css"/>
  <link rel="stylesheet" href="design-system/components.css"/>
  <link rel="stylesheet" href="assets/css/os-theme.css"/>

  <style>
    /* High-visibility Kitchen Display Dark Theme */
    body.kds-theme {
      background-color: #0b0f19;
      color: #f8fafc;
    }

    .kds-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      min-height: calc(100vh - 120px);
    }

    @media (max-width: 1024px) {
      .kds-board {
        grid-template-columns: 1fr;
      }
    }

    .kds-column {
      background: #131b2e;
      border: 1px solid #1e293b;
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .kds-ticket {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.15s ease;
    }

    .kds-ticket.pending { border-left: 5px solid var(--status-warning); }
    .kds-ticket.preparing { border-left: 5px solid var(--status-info); }
    .kds-ticket.ready { border-left: 5px solid var(--status-success); }
  </style>
</head>
<body class="os-body kds-theme">

  <div style="padding: 1.25rem clamp(1rem, 4vw, 2rem); width: 100%;">
    
    <!-- KDS Header Bar -->
    <div class="os-flex-between" style="margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid #1e293b; flex-wrap: wrap; gap: 1rem;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="index.html" class="os-btn os-btn-secondary os-btn-sm" style="background: #1e293b; color: #ffffff; border-color: #334155;">
          <span class="material-symbols-outlined text-[16px]">arrow_back</span>
          <span>Mission Control</span>
        </a>
        <div>
          <h1 style="font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; color: #ffffff;">
            Live Kitchen Display System (KDS)
          </h1>
          <div style="font-size: 0.75rem; color: #94a3b8;">
            Real-time fulfillment queue • Autonomous revenue sync on completion
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;">
        <button type="button" class="os-btn os-btn-secondary os-btn-sm" id="btn-kds-simulate" style="background: #1e293b; color: #ffffff; border-color: #334155;">
          <span class="material-symbols-outlined text-[16px]">add_circle</span>
          <span>Simulate Incoming Ticket</span>
        </button>
        <span class="os-badge os-badge-success">
          <span class="os-pulse-dot"></span>
          <span>WebSocket Stream Active</span>
        </span>
      </div>
    </div>

    <!-- 3-Column KDS Pipeline -->
    <div class="kds-board">
      
      <!-- 1. PENDING COLUMN -->
      <div class="kds-column">
        <div class="os-flex-between" style="margin-bottom: 1rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem;">
          <h2 style="font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--status-warning);">
            1. New Orders (<span id="count-pending">0</span>)
          </h2>
          <span style="font-size: 0.75rem; color: #94a3b8;">Awaiting Prep</span>
        </div>
        <div id="tickets-pending" style="flex: 1; overflow-y: auto;">
          <!-- Dynamic -->
        </div>
      </div>

      <!-- 2. PREPARING COLUMN -->
      <div class="kds-column">
        <div class="os-flex-between" style="margin-bottom: 1rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem;">
          <h2 style="font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--status-info);">
            2. In Preparation (<span id="count-preparing">0</span>)
          </h2>
          <span style="font-size: 0.75rem; color: #94a3b8;">At Station / Bar</span>
        </div>
        <div id="tickets-preparing" style="flex: 1; overflow-y: auto;">
          <!-- Dynamic -->
        </div>
      </div>

      <!-- 3. READY FOR PICKUP COLUMN -->
      <div class="kds-column">
        <div class="os-flex-between" style="margin-bottom: 1rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem;">
          <h2 style="font-size: 0.875rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--status-success);">
            3. Ready for Service (<span id="count-ready">0</span>)
          </h2>
          <span style="font-size: 0.75rem; color: #94a3b8;">Notify Customer</span>
        </div>
        <div id="tickets-ready" style="flex: 1; overflow-y: auto;">
          <!-- Dynamic -->
        </div>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="design-system/client-config.js"></script>
  <script src="assets/js/os-core.js"></script>
  <script src="assets/js/stock-engine.js"></script>
  <script src="assets/js/invoice-engine.js"></script>
  <script src="assets/js/order-engine.js"></script>
  <script src="assets/js/rota-engine.js"></script>
  <script src="assets/js/forecast-engine.js"></script>
  <script src="assets/js/autonomous-agent.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderKdsBoard();

      document.getElementById('btn-kds-simulate')?.addEventListener('click', () => {
        window.KallistoAutonomousAgent.simulateIncomingOrder();
        renderKdsBoard();
      });

      window.addEventListener('kallisto:orderCreated', () => renderKdsBoard());
      window.addEventListener('kallisto:orderUpdated', () => renderKdsBoard());
      window.addEventListener('kallisto:stateSaved', () => renderKdsBoard());
    });

    function renderKdsBoard() {
      const state = window.KallistoOS.getState();
      const client = window.KallistoClients.getCurrentClient();

      const pendingOrders = state.orders.filter(o => o.status === 'pending');
      const prepOrders = state.orders.filter(o => o.status === 'preparing');
      const readyOrders = state.orders.filter(o => o.status === 'ready');

      document.getElementById('count-pending').textContent = pendingOrders.length;
      document.getElementById('count-preparing').textContent = prepOrders.length;
      document.getElementById('count-ready').textContent = readyOrders.length;

      // 1. Pending Column
      const pendingContainer = document.getElementById('tickets-pending');
      pendingContainer.innerHTML = pendingOrders.length === 0 ? emptyKdsState('No new orders waiting') : pendingOrders.map(order => renderTicket(order, client, 'Start Preparing', 'preparing')).join('');

      // 2. Preparing Column
      const prepContainer = document.getElementById('tickets-preparing');
      prepContainer.innerHTML = prepOrders.length === 0 ? emptyKdsState('No items currently in preparation') : prepOrders.map(order => renderTicket(order, client, 'Mark Ready', 'ready')).join('');

      // 3. Ready Column
      const readyContainer = document.getElementById('tickets-ready');
      readyContainer.innerHTML = readyOrders.length === 0 ? emptyKdsState('No orders waiting for collection') : readyOrders.map(order => renderTicket(order, client, 'Dispatch & Settle', 'dispatched')).join('');
    }

    function renderTicket(order, client, actionLabel, nextStatus) {
      return `
        <div class="kds-ticket ${order.status}">
          <div>
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
              <div>
                <span style="font-family: var(--font-mono); font-size: 1.125rem; font-weight: 800; color: #ffffff;">${order.id}</span>
                <div style="font-size: 0.8125rem; font-weight: 700; color: var(--brand-primary);">${window.KallistoOS.escapeHtml(order.table)}</div>
              </div>
              <span style="font-family: var(--font-mono); font-size: 0.75rem; color: #94a3b8; background: #0f172a; padding: 2px 6px; border-radius: 4px;">
                ${order.time}
              </span>
            </div>

            <div style="font-size: 0.75rem; color: #cbd5e1; margin-bottom: 0.75rem;">Customer: <strong>${window.KallistoOS.escapeHtml(order.customer)}</strong></div>

            <div style="border-top: 1px solid #334155; padding-top: 0.5rem; margin-bottom: 1rem;">
              ${order.items.map(item => `
                <div style="display: flex; justify-content: space-between; font-size: 0.875rem; padding: 0.25rem 0;">
                  <span style="font-weight: 700; color: #ffffff;">${item.qty}x ${window.KallistoOS.escapeHtml(item.name)}</span>
                  ${item.notes ? `<span style="font-size: 0.75rem; color: #f59e0b; font-style: italic;">(${item.notes})</span>` : ''}
                </div>
              `).join('')}
            </div>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 0.75rem;">
            <span style="font-family: var(--font-mono); font-weight: 700; color: #ffffff;">${client.currency}${order.total.toFixed(2)}</span>
            <button type="button" class="os-btn os-btn-primary os-btn-sm" onclick="advanceTicket('${order.id}')">
              ${actionLabel} →
            </button>
          </div>
        </div>
      `;
    }

    function emptyKdsState(text) {
      return `
        <div style="text-align: center; color: #64748b; padding: 3rem 1rem; font-size: 0.8125rem;">
          <span class="material-symbols-outlined text-3xl" style="opacity: 0.4; display: block; margin-bottom: 0.5rem;">done_all</span>
          ${text}
        </div>
      `;
    }

    function advanceTicket(orderId) {
      window.KallistoOrderEngine.advanceOrderStatus(orderId);
      renderKdsBoard();
    }
  </script>
</body>
</html>
