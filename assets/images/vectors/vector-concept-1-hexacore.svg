<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="hexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagon Outer Shell -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" stroke="url(#coreGlow)" stroke-width="3" fill="url(#hexBg)"/>

  <!-- Inner Hexagon Ring -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" stroke="#1e3a8a" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Illuminated Hex Core -->
  <polygon points="44,40 58,40 65,52 58,64 44,64 37,52" fill="url(#coreGlow)" filter="url(#glowFilter)"/>

  <!-- Ascending Growth Arrows -->
  <path d="M48 48 L64 32 M64 32 L56 32 M64 32 L64 40" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M56 56 L76 36 M76 36 L68 36 M76 36 L76 44" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 64 L86 40 M86 40 L78 40 M86 40 L86 48" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
